name: Dev Agent Runner

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model override (optional)'
        required: false
        default: ''
      force_task_id:
        description: 'Force a specific task id from agents/dev-agent/backlog.json'
        required: false
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-agent-runner
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/dev-agent/requirements.txt

      # This Node major is NOT free to drift from the rest of
      # `.github/workflows/`. It ran `20` from the day this workflow was
      # written until 2026-08-08, and Node 20 reached end of life on
      # 2026-04-30 (nodejs/Release `schedule.json`, `v20.end`), so for the
      # ~100 days before this line changed, the one job in this repository
      # holding `contents: write`, `pull-requests: write` and three LLM API
      # keys was the only one running an unpatched runtime.
      #
      # Nothing objected, and that is the part worth fixing rather than the
      # digit. `src/__tests__/workflow-audit-parity.test.ts` has compared
      # `node-version:` across workflows since PR #111, but its corpus was two
      # hand-named files (ci.yml and security-audit.yml), so the four
      # workflows outside those two names could drift while the guard stayed
      # green. That guard now discovers this directory instead of naming it,
      # which is what makes this line hold.
      - name: Install Node (for verification)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm deps
        run: |
          npm ci

      # This step deliberately carries no `env:` block. It used to inject
      # OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY and GITHUB_TOKEN into
      # a body whose only command is `echo`, which cannot read any of them:
      # step-level `env:` is scoped to its own step and never reaches the next
      # one, so those four secrets were decrypted into a runner environment that
      # had no use for them. The runner step below declares the three keys it
      # actually needs. GITHUB_TOKEN was never needed at all -- nothing under
      # `agents/dev-agent/` reads it.
      # `src/__tests__/workflow-secret-usage.test.ts` fails the quality gate if
      # a no-op step is handed a secret again.
      - name: Configure environment
        run: |
          echo "Environment configured"

      - name: Run dev-agent runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE_TASK_ID: ${{ github.event.inputs.force_task_id }}
          LLM_MODEL: ${{ github.event.inputs.model }}
          IN_GITHUB_ACTIONS: true
        run: |
          python agents/dev-agent/runner.py

# E2E smoke suite (v0.16, docs/design/E2E_SMOKE.md).
#
# Runs on every PR and every main push. REQUIRED branch-protection context
# since 2026-08-18: design decision D4 shipped it deliberately non-required so
# a browser suite would earn requiredness through observed stability, and it
# did - 144 post-merge runs over 22 days with zero failures (the evidence is
# recorded in .github/required-checks.json's `e2e` entry).
#
# The suite walks the REAL static export (out/ from a production build)
# served under the production basePath - which is the repo name, derived from
# GITHUB_REPOSITORY in site-base-path.mjs, the single source of truth that
# next.config.ts, playwright.config.ts and e2e/serve.mjs all import rather than
# re-derive - never `next dev`, because the prerender/hydrate boundary of the
# exported artifact is half the reason the suite exists (design decision D3).

name: E2E Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version (browser cache key)
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Build the static export
        run: npm run build

      - name: Run E2E smoke suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
